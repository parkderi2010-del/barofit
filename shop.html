<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F4F7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="바로핏">

<title>바로핏 상점</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>

  /* ── 토큰 ───────────────────────────────
     평소: 차분한 측정 도구 (쿨 그레이 + 수평계 블루)
     할매: 만화 폭발 (옐로 + 핫핑크 + 굵은 외곽선) */
  :root{
    --paper:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#16181D;
    --ink-2:#5B616B;
    --hair:#DCE1E7;
    --level:#2F5BEA;
    --good:#1FA971;
    --bad:#E5484D;
    --away:#AEB4BD;
    --h-yellow:#FFE14D;
    --h-yellow-2:#FFC800;
    --h-pink:#FF3D7F;
    --h-pink-soft:#FFB3CF;
    --ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    --comic:"Black Han Sans","Pretendard Variable",-apple-system,"Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
    -webkit-text-size-adjust:100%;font-feature-settings:"tnum" 1}
  button{font:inherit}
  :focus-visible{outline:3px solid var(--level);outline-offset:2px}

  /* ── 상단 ── */
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 8px;max-width:1240px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.4px}
  .brand-mark{width:30px;height:30px}
  .top-note{font-size:13px;color:var(--ink-2)}
  .nav{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;box-shadow:inset 0 0 0 1px var(--hair)}
  .nav a{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink-2);text-decoration:none}
  .nav a.on{background:var(--ink);color:#fff}
  @media (max-width:520px){ .nav a{padding:8px 9px;font-size:13px} .brand{font-size:17px} }

  /* ── 레이아웃 ── */
  .app{display:grid;gap:20px;padding:12px 24px 40px;max-width:1240px;margin:0 auto;grid-template-columns:1fr}
  @media (min-width:960px){ .app{grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr);align-items:start} }
  @media (max-width:520px){ .top{padding:16px 16px 4px} .app{padding:10px 16px 32px} }

  /* ── 카메라 ── */
  .cam{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:#20242B}
  .cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .cam canvas{pointer-events:none}
  .cam-empty{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;padding:28px;color:#C9CED6}
  .cam-empty svg{width:88px;height:88px;margin:0 auto;opacity:.9}
  .cam-empty p{margin:0;font-size:15px;line-height:1.6;max-width:30ch}
  .badge{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;
    border-radius:999px;background:rgba(22,24,29,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;font-size:14px;font-weight:700}
  .badge i{width:9px;height:9px;border-radius:50%;background:var(--away)}
  .badge.good i{background:var(--good)} .badge.bad i{background:var(--bad)}
  .cam-edge{position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 0 0 var(--bad);transition:box-shadow .2s;pointer-events:none}
  .cam-edge.on{box-shadow:inset 0 0 0 6px var(--bad)}
  .toast{position:absolute;left:50%;top:0;transform:translate(-50%,-120%);opacity:0;background:var(--surface);color:var(--ink);
    padding:10px 16px;border-radius:14px;font-size:15px;font-weight:700;box-shadow:0 6px 24px rgba(22,24,29,.18);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .2s;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.show{transform:translate(-50%,66px);opacity:1}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{border:0;border-radius:14px;padding:14px 20px;min-height:52px;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
  .btn-primary{background:var(--ink);color:#fff;box-shadow:none}
  .btn-quiet{background:transparent;box-shadow:none;color:var(--ink-2);padding-left:8px;padding-right:8px}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn[hidden]{display:none}
  .help{margin:14px 2px 0;font-size:14px;line-height:1.65;color:var(--ink-2);max-width:62ch}
  .error{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:#FDECEC;color:#9B1C1F;font-size:14px;line-height:1.6}
  .privacy{display:flex;gap:8px;align-items:flex-start;margin:12px 2px 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}

  /* ── 패널 ── */
  .panel{background:var(--surface);border-radius:24px;padding:22px}
  .panel + .panel{margin-top:16px}
  .panel h2{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--ink-2)}

  /* 수평계: 자세가 흐트러질수록 기포가 가운데에서 벗어남 */
  .level-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .level-state{font-size:26px;font-weight:800;letter-spacing:-.8px}
  .level-score{font-size:15px;color:var(--ink-2);font-weight:600}
  .level-score b{font-size:22px;color:var(--ink);font-weight:800}
  .level{position:relative;height:52px;border-radius:26px;background:var(--paper);overflow:hidden}
  .level::before,.level::after{content:"";position:absolute;top:10px;bottom:10px;width:2px;background:#C5CCD5;border-radius:1px}
  .level::before{left:calc(50% - 34px)} .level::after{left:calc(50% + 32px)}
  .bubble{position:absolute;top:8px;width:36px;height:36px;margin-left:-18px;left:50%;border-radius:50%;
    background:var(--away);transition:left .45s cubic-bezier(.3,.8,.3,1),background .3s;
    box-shadow:inset -4px -5px 0 rgba(0,0,0,.08),inset 4px 4px 0 rgba(255,255,255,.45)}
  .bubble.good{background:var(--good)} .bubble.bad{background:var(--bad)}

  .figures{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px}
  .figure{padding:0 14px;border-left:1px solid var(--hair)}
  .figure:first-child{padding-left:0;border-left:0}
  .figure b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
  .figure span{font-size:13px;color:var(--ink-2)}
  .timeline{display:block;width:100%;height:12px;margin-top:22px;border-radius:6px;background:var(--paper)}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--ink-2)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

  /* 설정 */
  details.panel summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    font-size:15px;font-weight:700;color:var(--ink)}
  details.panel summary::-webkit-details-marker{display:none}
  details.panel summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);
    transform:rotate(45deg);transition:transform .2s;margin-right:4px}
  details[open].panel summary::after{transform:rotate(-135deg)}
  .settings{margin-top:18px;display:grid;gap:20px}
  .field-label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px}
  .field-label small{font-weight:600;color:var(--level)}
  .field-note{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
  .seg{display:flex;background:var(--paper);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 6px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:42px}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,24,29,.12)}
  input[type=range]{width:100%;accent-color:var(--level);height:28px}

  /* 리포트 */
  .report{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
  .report-avatar{width:96px;height:96px;border-radius:50%;background:var(--h-yellow);display:grid;place-items:center;overflow:hidden}
  .report-avatar svg{width:92px;height:92px;margin-top:10px}
  .report-quote{font-family:var(--comic);font-size:21px;line-height:1.35;margin:0}
  .report-list{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}
  .report-list li{display:flex;justify-content:space-between;font-size:15px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
  .report-list li b{font-weight:800}

  /* ── 할매 등판 (병맛 구간) ───────────────── */
  .halmae{position:fixed;inset:0;z-index:50;display:none;place-items:center;overflow:hidden;cursor:pointer;
    background:
      radial-gradient(circle at 50% 42%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 26%),
      repeating-conic-gradient(from 0deg at 50% 42%,var(--h-yellow) 0 5deg,var(--h-yellow-2) 5deg 10deg)}
  .halmae.happy{background:
      radial-gradient(circle at 50% 42%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 26%),
      repeating-conic-gradient(from 0deg at 50% 42%,var(--h-pink-soft) 0 5deg,#FF8FB8 5deg 10deg)}
  .halmae.show{display:grid}
  .halmae::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
    background-image:radial-gradient(var(--ink) 1.2px,transparent 1.4px);background-size:9px 9px}
  .halmae.show.angry .h-stage{animation:shake .5s steps(2) 2}
  .h-stage{position:relative;display:grid;justify-items:center;gap:6px;width:min(92vw,720px);padding:20px}
  .h-face{width:min(58vw,330px);height:auto;animation:faceIn .5s cubic-bezier(.2,1.6,.4,1) both}
  .halmae.angry .h-face{animation:faceIn .5s cubic-bezier(.2,1.6,.4,1) both,jitter .12s linear .5s infinite}
  .halmae.happy .h-face{animation:faceIn .5s cubic-bezier(.2,1.6,.4,1) both,bob 1s ease-in-out .5s infinite}
  .h-text{margin:0;text-align:center;font-family:var(--comic);font-weight:400;color:#fff;line-height:1.12;
    font-size:clamp(34px,7.4vw,74px);letter-spacing:-.5px;transform:rotate(-3deg);
    -webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--h-pink);word-break:keep-all}
  .halmae.happy .h-text{text-shadow:7px 7px 0 var(--h-yellow-2)}
  .h-text.long{font-size:clamp(28px,5.4vw,58px);-webkit-text-stroke-width:7px;max-width:16em}
  .h-text span{display:inline-block;animation:pop .35s cubic-bezier(.2,1.8,.4,1) both}
  .h-sticker{position:absolute;font-family:var(--comic);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;
    font-size:clamp(30px,6vw,56px);animation:pop .35s cubic-bezier(.2,1.8,.4,1) .15s both}
  .h-bang{top:4%;left:4%;rotate:-14deg;padding:28px 30px;background:var(--h-pink);
    clip-path:polygon(50% 0,61% 30%,95% 20%,72% 47%,100% 66%,66% 70%,70% 100%,50% 78%,28% 100%,32% 71%,0 66%,28% 47%,6% 20%,39% 30%)}
  .h-vein{top:6%;right:8%;font-size:clamp(48px,9vw,90px);-webkit-text-stroke:0;animation-delay:.25s}
  .h-slipper{position:absolute;left:50%;top:40%;font-size:64px;line-height:1;pointer-events:none;opacity:0;animation:slipper 1.25s cubic-bezier(.5,0,.6,1) .45s forwards}
  .h-hearts{position:absolute;inset:0;pointer-events:none}
  .h-hearts span{position:absolute;bottom:-60px;font-size:34px;animation:rise 2.6s ease-in forwards}
  .h-hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--ink);opacity:.55}

  @keyframes faceIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes jitter{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,2px) rotate(-1.5deg)}50%{transform:translate(3px,-2px) rotate(1.5deg)}75%{transform:translate(-2px,-1px) rotate(-1deg)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes shake{0%{transform:translate(-12px,6px)}50%{transform:translate(12px,-6px)}100%{transform:translate(0,0)}}
  @keyframes slipper{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.4) rotate(0)}
    55%{opacity:1;transform:translate(-50%,-50%) scale(5.2) rotate(560deg)}
    68%{opacity:1;transform:translate(-50%,-50%) scale(4.8) rotate(575deg)}
    100%{opacity:0;transform:translate(-50%,80vh) scale(4.8) rotate(600deg)}}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-115vh) scale(1.3);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .halmae *,.halmae.show .h-stage{animation:none!important}
    .h-slipper,.h-hearts{display:none}
    .bubble,.toast{transition:none}
  }

  @media (max-width:520px){ .nav a{padding:8px 9px;font-size:13px} .brand{font-size:17px} }
  .ad-slot{position:relative;margin-top:16px;border-radius:16px;border:1.5px dashed #C5CCD5;background:#F7F8FA;min-height:92px;display:grid;place-items:center;text-align:center;padding:18px}
  .ad-tag{position:absolute;top:8px;left:10px;font-size:11px;font-weight:800;color:#8A919B;background:#fff;border-radius:6px;padding:2px 6px;box-shadow:inset 0 0 0 1px var(--hair)}
  .ad-body{font-size:13px;font-weight:700;color:#8A919B;line-height:1.5}
  .ad-body small{display:block;font-weight:500;font-size:12px}

  .shop{max-width:1240px;margin:0 auto;padding:12px 24px 40px}
  @media (max-width:520px){ .shop{padding:10px 16px 32px} }
  .pick{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;background:var(--h-yellow);border-radius:24px;padding:18px 22px;overflow:hidden}
  .pick .report-avatar{width:110px;height:110px;background:#fff}
  .pick .report-avatar svg{width:104px;height:104px}
  .pick p{margin:0;font-family:var(--comic);font-size:clamp(20px,3.4vw,30px);line-height:1.3}
  .pick small{display:block;font-family:var(--ui);font-size:14px;font-weight:600;margin-top:6px;color:#4A3B00}
  @media (max-width:520px){ .pick{grid-template-columns:80px 1fr;padding:14px} .pick .report-avatar{width:76px;height:76px} .pick .report-avatar svg{width:72px;height:72px} }
  .disclose{margin:12px 2px 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
  .cats button{border:0;border-radius:999px;padding:10px 16px;min-height:42px;font-size:14px;font-weight:700;background:var(--surface);color:var(--ink-2);cursor:pointer;box-shadow:inset 0 0 0 1px var(--hair)}
  .cats button.on{background:var(--ink);color:#fff;box-shadow:none}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .thumb{aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center}
  .thumb svg{width:56%;height:auto}
  .card h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
  .card p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .card .say{font-family:var(--comic);font-size:15px;color:var(--ink);background:#FFF8D6;border-radius:10px;padding:8px 10px}
  .card .tag{align-self:flex-start;font-size:11.5px;font-weight:800;color:var(--level);background:#EAF0FF;border-radius:6px;padding:3px 7px}
  .card .btn{margin-top:auto;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
  .grid .ad-slot{margin-top:0;min-height:100%}
  .howto{margin-top:22px;font-size:13px;color:var(--ink-2);line-height:1.6;background:var(--surface);border-radius:16px;padding:14px 16px}

  /* ══ 디자인 v2 ══════════════════════════════ */
  :root{--paper:#F2F4F7;--level:#3557F5;--good:#17B26A;--bad:#F04438;--radius-l:28px}
  body{background:var(--paper)}
  .top{position:sticky;top:0;z-index:30;max-width:none;margin:0;gap:14px;
    padding:14px max(24px,calc((100vw - 1240px)/2 + 24px));
    background:rgba(242,244,247,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
  .brand{text-decoration:none;color:var(--ink);font-size:19px}
  .top .nav{margin-left:auto}
  .nav a{display:flex;align-items:center;gap:7px;padding:9px 14px}
  .nav svg{width:18px;height:18px}
  .persona-chip{border:0;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;
    background:#FFE14D;color:#16181D;white-space:nowrap}
  .persona-chip.is-coach{background:#E6ECFF;color:#2443D6}
  .tabbar{display:none}
  @media (max-width:720px){
    .top{padding:12px 16px}
    .top .nav{display:none}
    .persona-chip{margin-left:auto}
    .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
      background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-top:1px solid var(--hair);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
    .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:700;color:#8A919B;text-decoration:none}
    .tabbar a.on{color:var(--ink)}
    .tabbar a.on svg{color:var(--level)}
    .tabbar svg{width:24px;height:24px}
    body{padding-bottom:88px}
  }
  .panel{border-radius:var(--radius-l);padding:24px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .panel h2,.panel-head h2{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
  details.panel summary{font-size:16px}
  .cam{border-radius:var(--radius-l);box-shadow:0 12px 32px rgba(16,24,40,.14)}
  .cam::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(rgba(10,12,16,0),rgba(10,12,16,.55));pointer-events:none}
  .cam .badge,.cam .hud-count,.cam .hud-timer,.cam .toast{z-index:2}
  .cam-edge{border-radius:var(--radius-l)}
  .btn{border-radius:16px;transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .seg{border-radius:14px}
  .bubble.good{background:var(--good)} .bubble.bad{background:var(--bad)}
  [data-persona="coach"] .report-avatar{background:#E6ECFF}
  [data-persona="coach"] .pick{background:#E6ECFF}
  [data-persona="coach"] .pick small{color:#2443D6}
  [data-persona="coach"] .card .say{background:#EEF2FF;font-family:var(--ui);font-weight:700}
  [data-persona="coach"] .report-quote,[data-persona="coach"] .hello p,[data-persona="coach"] .pick p{font-family:var(--ui);font-weight:800;letter-spacing:-.5px}

  /* 코치 알림 카드 */
  .coach{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,160%);z-index:55;
    width:min(92vw,640px);background:#fff;border-radius:24px;padding:18px 20px;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;
    box-shadow:0 20px 50px rgba(16,24,40,.22);transition:transform .35s cubic-bezier(.2,.9,.3,1.15);cursor:pointer}

};
const CAT_KO = Object.fromEntries(CATS);
const AD = `<div class="ad-slot" aria-label="광고 자리"><span class="ad-tag">광고</span><div class="ad-body">광고가 들어갈 자리예요<small>구글 애드센스 승인을 받으면 여기에 광고 코드를 붙여 넣어요</small></div></div>`;

// 오늘 운동 기록을 보고 할매가 추천
const pad2 = n => String(n).padStart(2, "0"), d = new Date(), today = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
let LOG = []; try { LOG = JSON.parse(localStorage.getItem("barofit-log") || "[]"); } catch (e) {}
const todayW = LOG.filter(e => e.type === "workout" && e.date === today);
const groups = [...new Set(todayW.flatMap(s => s.items.map(i => i.group)))];
const PICK = {
  gs: { did: g => `오늘 ${g} 했으면 단백질 챙겨 묵어라!`, none: "운동부터 하고 묵어라! 그래도 물은 묵고!", sub: "운동한 날은 단백질, 안 한 날은 물부터 챙기세요." },
  jl: { did: g => `오늘 ${g} 했으믄 단백질 챙겨 묵어야!`, none: "운동부터 하고 묵어야! 그래도 물은 묵고!", sub: "운동한 날은 단백질, 안 한 날은 물부터 챙기세요." },
  sd: { did: g => `오늘 ${g} 했으면 단백질 챙겨 먹어라!`, none: "운동부터 하고 먹어라! 그래도 물은 마시고!", sub: "운동한 날은 단백질, 안 한 날은 물부터 챙기세요." }
};
PICK.coach = { did: g => `오늘 ${g} 운동을 하셨네요. 단백질을 챙겨 보세요.`, none: "운동 전후로 수분부터 챙겨 보세요.", sub: "운동한 날은 단백질, 안 한 날은 물부터 챙기세요." };
const COACH_SAY = { shake: "운동 후에 단백질을 간편하게 채워요.", chicken: "식사로 단백질을 채우기 좋아요.", snack: "출출할 때 과자 대신 좋아요.", drink: "운동 중에는 수분을 자주 챙겨 주세요." };
const P = isCoach() ? PICK.coach : (PICK[settings.dialect] || PICK.gs);
let cat = todayW.length ? (groups.includes("하체") || groups.length > 2 ? "shake" : "chicken") : "drink";
$("avatar").innerHTML = halmaeSVG("happy");
$("pickText").innerHTML = (todayW.length ? P.did(groups.join(", ")) : P.none) + `<small>${P.sub} 추천: ${CAT_KO[cat]}</small>`;

// ===== 포인트 교환소 (오픈 예정) =====
// 실제 할인은 직접 판매하거나 교환권을 지급할 때 열 수 있어요. 지금은 목표까지 얼마나 남았는지만 보여줘요.
const REWARDS = [
  { need: 1000, name: "프로틴 바 1개 교환권" },
  { need: 3000, name: "닭가슴살 3,000원 할인 쿠폰" },
  { need: 5000, name: "프로틴 쉐이크 5,000원 할인 쿠폰" },
  { need: 10000, name: "단백질 간식 세트 교환권" }
];
function renderRewards() {
  const bal = window.HM ? HM.wallet().balance : 0;
  $("ptNow").textContent = bal.toLocaleString("ko-KR");
  $("rewards").innerHTML = REWARDS.map(r => {
    const pct = Math.min(100, Math.round(bal / r.need * 100));
    return `<div class="reward"><b>${r.name}</b><div class="need">${r.need.toLocaleString("ko-KR")}P${bal >= r.need ? ", 모았어요!" : `, ${(r.need - bal).toLocaleString("ko-KR")}P 남음`}</div><div class="bar"><i style="width:${pct}%"></i></div><span class="soon">교환 오픈 예정</span></div>`;
  }).join("");
}
renderRewards();

// ===== 상품 목록 파일(products.json) 불러오기: 없으면 위의 기본 목록 사용 =====
fetch("products.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(d => {
  if (d && Array.isArray(d.products) && d.products.length) {
    PRODUCTS.length = 0; d.products.forEach(p => PRODUCTS.push(p));
    if (d.disclosure) $("disclose").textContent = d.disclosure;
    render();
  }
}).catch(() => {});

function render() {
  $("cats").innerHTML = CATS.map(([k, v]) => `<button data-c="${k}" class="${k === cat ? "on" : ""}" aria-pressed="${k === cat}">${v}</button>`).join("");
  const list = PRODUCTS.filter(p => cat === "all" || p.cat === cat);
  const cards = list.map((p, i) => `<article class="card">
      ${p.image ? `<img class="photo" src="${p.image}" alt="${p.name}" loading="lazy">` : `<div class="thumb" style="background:${(THUMB[p.cat] || THUMB.shake).bg}">${(THUMB[p.cat] || THUMB.shake).svg}</div>`}
      <span class="tag">${CAT_KO[p.cat] || "기타"}</span>
      <h3>${p.name}</h3><p>${p.desc}</p>
      <div class="say">코치: ${COACH_SAY[p.cat] || COACH_SAY.shake}</div>
      <span class="ptsave">포인트 할인은 교환소 오픈 후 적용돼요</span>
      <a class="btn btn-primary" href="${p.link || "#"}" data-i="${PRODUCTS.indexOf(p)}" ${p.link ? 'rel="sponsored noopener" target="_blank"' : ""}>구매하러 가기</a>
    </article>`);
  if (cards.length >= 3) cards.splice(3, 0, AD); else cards.push(AD);
  $("grid").innerHTML = cards.join("");
}
$("cats").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cat = b.dataset.c; render(); });
$("grid").addEventListener("click", e => {
  const a = e.target.closest("a[data-i]"); if (!a) return;
  if (!PRODUCTS[a.dataset.i].link) { e.preventDefault(); const t = $("toast"); t.textContent = "아직 판매 링크가 연결되지 않았어요"; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
});
render();

try { window.__coach && window.__coach.faces(m => halmaeSVG(m, true)); } catch (e) {}
</script>
</body>
</html>
